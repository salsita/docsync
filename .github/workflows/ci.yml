name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      # Earliest possible check that both shims are installed and runnable,
      # including the Windows shim for the git remote helper.
      - name: Smoke test the installed executables
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --global "$PWD"
          expected=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          for cmd in docsync git-remote-docsync; do
            actual=$("$cmd" --version)
            if [ "$actual" != "$expected" ]; then
              echo "$cmd --version printed '$actual', expected '$expected'" >&2
              exit 1
            fi
            echo "$cmd --version -> $actual"
          done
